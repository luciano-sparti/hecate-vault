[workspace]
resolver = "2"
members = [
    "crates/hecate-crypto",
    "crates/hecate-protocol",
    "crates/hecate-core",
    "crates/hecate-agent",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Luciano Sparti <https://github.com/luciano-sparti>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/luciano-sparti/hecate-vault"
homepage = "https://github.com/luciano-sparti/hecate-vault"
keywords = ["vault", "hsm", "encryption", "security", "tui"]
categories = ["cryptography", "command-line-utilities"]

[workspace.dependencies]
# Internal Workspace Crates
hecate-crypto = { version = "0.2.0", path = "crates/hecate-crypto" }
hecate-protocol = { version = "0.2.0", path = "crates/hecate-protocol" }
hecate-core = { version = "0.2.0", path = "crates/hecate-core" }
hecate-agent = { version = "0.2.0", path = "crates/hecate-agent" }

# Cryptography & Security
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1.8", features = ["zeroize_derive", "alloc", "serde"] }
rand = "0.8"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
keyring = "3.2"
libc = "0.2"

# Protocol & gRPC
prost = "0.13"
tonic = { version = "0.12", features = ["tls", "transport"] }
tonic-build = "0.12"
prost-build = "0.13"
tokio = { version = "1.40", features = ["full"] }

# CLI & UX
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Serialization & Storage
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
tempfile = "3.10"
fd-lock = "4.0"
rcgen = "0.13"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"


